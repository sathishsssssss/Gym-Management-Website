<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Sleek Fitness</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

    <div class="login-box card">

        <a class="logo" href="index.html">
            SLEEK<span>FITNESS</span>
        </a>

        <h1>
            Admin Login
        </h1>

        <p>
            Demo admin panel for college project.
        </p>

        <form id="loginForm">

            <label>
                Email

                <input
                    id="adminEmail"
                    type="email"
                    required
                    value="admin@sleekfitness.in">
            </label>

            <label>
                Password

                <input
                    id="adminPassword"
                    type="password"
                    required
                    value="admin123">
            </label>

            <button
                class="btn"
                type="submit">

                Login

            </button>

            <p id="loginMsg"></p>

        </form>

        <a href="index.html">
            ← Back to website
        </a>

    </div>

    <script src="script.js"></script>

</body>

</html>
